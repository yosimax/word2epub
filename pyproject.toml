[tool.poetry]
name = "yaml2epub"
version = "0.0.0"
description = "Simple YAML -> EPUB3 conversion script"
authors = ["yosimax <cmax-kudo@s3.dion.ne.jp>"]
readme = "READEME_yaml2epub.md"

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
jinja2 = "3.1.6"
lxml = "6.1.1"
markupsafe = "3.0.3"
pyyaml = "6.0.3"

[tool.poetry.group.dev.dependencies]
black = "26.5.1"
ruff = "0.15.21"
isort = "8.0.1"
mypy = "2.2.0"
pytest = "9.1.1"
pytest-cov = "7.1.0"
pre-commit = "4.6.0"
pip-tools = "7.5.3"
coverage = { version = "7.15.0", extras = ["toml"] }

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
